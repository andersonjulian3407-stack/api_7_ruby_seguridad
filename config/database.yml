default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host:     <%= ENV.fetch("DB_HOST",     "localhost") %>
  port:     <%= ENV.fetch("DB_PORT",     "5432") %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *default
  database: companies_api_development

test:
  <<: *default
  database: companies_api_test

production:
  <<: *default
  database: <%= ENV["DB_NAME"] || "companies_api_production" %>
  # En Render usar la variable DATABASE_URL completa:
  # url: <%= ENV["DATABASE_URL"] %>
